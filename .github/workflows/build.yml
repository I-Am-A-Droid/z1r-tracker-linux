# Builds and tests Z-Tracker on Linux, Windows and macOS, and offers each program as a download.
# Every push: the programs appear under the run's "Artifacts". A tag like v2.1.0: also a GitHub release with them.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: z1r-tracker-linux-x86_64
            target: x86_64-unknown-linux-gnu
            exe: z1r-tracker
          - os: windows-latest
            name: z1r-tracker-windows-x86_64
            target: x86_64-pc-windows-msvc
            exe: z1r-tracker.exe
          - os: macos-latest
            name: z1r-tracker-macos-apple-silicon
            target: aarch64-apple-darwin
            exe: z1r-tracker
          - os: macos-latest
            name: z1r-tracker-macos-intel
            target: x86_64-apple-darwin
            exe: z1r-tracker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} README.md dist/${{ matrix.name }}/
          cd dist && tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          & $iscc "/DExeDir=..\target\${{ matrix.target }}\release" windows\installer.iss
          Copy-Item dist\z1r-tracker-setup.exe dist\${{ matrix.name }}\
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.name }}.tar.gz
            dist/z1r-tracker-setup.exe

  # The Mac disk image: Z-Tracker.app for Apple Silicon and Intel in one, made with Apple's own tools.
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Make the .dmg
        run: macos/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: z1r-tracker-macos-dmg
          path: dist/z1r-tracker-macos.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/z1r-tracker-macos.dmg

  # The Linux AppImage: one file that runs on most 64-bit Linux systems (built against glibc 2.28 with zig).
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tools
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Make the AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: linux/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: z1r-tracker-linux-appimage
          path: dist/Z-Tracker-x86_64.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Z-Tracker-x86_64.AppImage
